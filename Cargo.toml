[package]
name = "free-sudoku-pwa"
version = "0.29.0"
edition = "2021"
default-run = "free-sudoku-pwa"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serde_bytes = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
web-sys = { version = "0.3", features = [
  "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam",
  "AudioBuffer", "AudioBufferSourceNode",
  "AudioScheduledSourceNode", "GainNode", "WaveShaperNode",
  "Event", "EventTarget", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Storage",
  "console",
  "KeyboardEvent",
  "ServiceWorker", "MessageChannel", "MessagePort", "MessageEvent",
  "Navigator", "HtmlDialogElement", "CssStyleDeclaration",
  "ResizeObserver", "ResizeObserverEntry", "DomRect", "DomRectReadOnly",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
] }

[features]
puzzle-bank-tools = []

[[bin]]
name = "import_puzzle_bank"
path = "src/bin/import_puzzle_bank.rs"
required-features = ["puzzle-bank-tools"]
